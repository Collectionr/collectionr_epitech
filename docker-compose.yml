# Environnement de développement local — PostgreSQL + Redis
# Usage : docker compose up -d
# Les valeurs correspondent au backend/.env.example.

services:
  postgres:
    image: postgres:16-alpine
    container_name: collectionr-postgres
    environment:
      POSTGRES_USER: collectionr
      POSTGRES_PASSWORD: collectionr
      POSTGRES_DB: collectionr
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U collectionr -d collectionr']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: collectionr-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
