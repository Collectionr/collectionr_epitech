[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcg-service"
version = "0.1.0"
description = "Collectionr TCG microservice (FastAPI) — technical foundation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

# Ruff is the single tool: `ruff check` lints and `ruff format` formats.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "TID251"]

[tool.ruff.lint.per-file-ignores]
# TID251 only guards domain/: every other layer may use the frameworks.
"src/tcg_service/application/**" = ["TID251"]
"src/tcg_service/infrastructure/**" = ["TID251"]
"src/tcg_service/interface/**" = ["TID251"]
"src/tcg_service/config.py" = ["TID251"]
"src/tcg_service/main.py" = ["TID251"]
"tests/**" = ["S101", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "domain/ must not import a framework (Clean Architecture)."
"pydantic".msg = "domain/ must not import a framework (Clean Architecture)."
"pydantic_settings".msg = "domain/ must not import a framework (Clean Architecture)."
"psycopg".msg = "domain/ must not import a framework (Clean Architecture)."
"psycopg_pool".msg = "domain/ must not import a framework (Clean Architecture)."
"redis".msg = "domain/ must not import a framework (Clean Architecture)."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real PostgreSQL database (TCG_TEST_DATABASE_URL), excluded by default",
]

[tool.coverage.run]
source = ["tcg_service"]
branch = true

[tool.coverage.report]
fail_under = 50
show_missing = true
