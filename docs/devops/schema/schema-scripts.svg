<svg xmlns="http://www.w3.org/2000/svg" width="680" height="140" viewBox="0 0 680 140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Les 3 scripts CollectionR dans l'ordre</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="140" rx="12" fill="#FFFFFF"/>
  <rect x="40" y="30" width="180" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="130" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">setup-*.sh</text>
  <text x="130" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Installe K3s</text>
  <text x="130" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Une fois par poste</text>
  <line x1="222" y1="68" x2="248" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="30" width="180" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">deploy.sh</text>
  <text x="340" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Lance les services</text>
  <text x="340" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Complet ou --light</text>
  <line x1="432" y1="68" x2="458" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="460" y="30" width="180" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="550" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">dev.sh</text>
