apiVersion: v1
kind: Service
metadata:
  name: redis-tcg
  namespace: development
  labels:
    app.kubernetes.io/name: redis-tcg
    app.kubernetes.io/part-of: collectionr
    app.kubernetes.io/component: queue
    app.kubernetes.io/managed-by: kubectl
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis-tcg
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-tcg
  namespace: development
  labels:
    app.kubernetes.io/name: redis-tcg
    app.kubernetes.io/part-of: collectionr
    app.kubernetes.io/component: queue
    app.kubernetes.io/managed-by: kubectl
spec:
  serviceName: redis-tcg
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-tcg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-tcg
        app.kubernetes.io/part-of: collectionr
        app.kubernetes.io/component: queue
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--appendonly"
            - "yes"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-tcg-credentials
                  key: password
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-tcg-credentials
                  key: password
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
