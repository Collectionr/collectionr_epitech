name: Worker OCR CI Python

on: 
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        branches: 
            - dev
            - main
        paths: 
            - 'microservices/worker-ocr/**'
            - '.github/workflows/workerOcr-ci.yaml'

permissions:
    contents: read 

concurrency: 
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    gitleaks: 
        name: Security - Gitleaks Scan 
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GITHUB_LICENSE: ${{ secrets.GITHUB_LICENSE }}

    worker-ocr:
        name: Worker OCR - Lint & Tests
        needs: [gitleaks]
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        defaults:
            run: 
                working-directory: microservices/worker-ocr/

        steps: 
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Python 3.13
              uses: actions/setup-python@v5
              with: 
                python-version: '3.13'
                cache: 'pip'
                cache-dependency-path: microservices/worker-ocr/requirements.txt

            - name: Install Ruff
              run: pip install ruff

            - name: Check code with Ruff
              run: |
                ruff check .
                ruff format --check .
            
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                if [ -f requirements.txt ]; then  pip install -r requirements.txt ; fi
                pip install pytest pytest-cov ruff
            - name: Run Pytest
              run: |
                if [ -d "tests" ]; then
                    pytest -v --cov=. --cov-fail-under=50
                else
                    echo "Aucun test pour le moment - étape ignorée."
                fi
            

            