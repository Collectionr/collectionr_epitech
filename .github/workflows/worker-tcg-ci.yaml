name: Worker TCG CI Python

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - dev
      - main
    paths:
      - 'microservices/tcg/**'
      - '.github/workflows/worker-tcg-ci.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Security - Gitleaks Scan
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  worker-tcg:
    name: Worker TCG - Lint & Tests
    needs: [gitleaks]
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/tcg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            microservices/tcg/requirements.txt
            microservices/tcg/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check code with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Check types with mypy
        run: mypy

      - name: Run Pytest
        env:
          PYTHONPATH: src
        run: pytest -v --cov --cov-fail-under=50
  notify-failure:
        name: Notify Discord on failure
        needs: [gitleaks, worker-tcg]
        if: failure()
        runs-on: ubuntu-latest
        steps:
          - name: Send Discord notification
            env:
              DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
              WORKFLOW: ${{ github.workflow }}
              REPO: ${{ github.repository }}
              BRANCH: ${{ github.head_ref || github.ref_name }}
              ACTOR: ${{ github.actor }}
              RUN_URL: ${{ github.server_url }}/${{ github.repository}}/actions/runs/${{ github.run_id }}
            run: |
              jq -n \
                --arg title "Echec CI : $WORKFLOW" \
                --arg repo "$REPO" \
                --arg branch "$BRANCH" \
                --arg actor "$ACTOR" \
                --arg url "[Voir le workflow]($RUN_URL)" \
                '{embeds: [{title: $title, color: 15158332, fields: [
                  {name: "Depot", value: $repo, inline: true},
                  {name: "Branche / PR", value: $branch, inline: true},
                  {name: "Auteur", value: $actor, inline: true},
                  {name: "Logs", value: $url, inline: false}
                ]}]}' | curl -fsS -H "Content-Type: application/json" -X \
                POST -d @- "$DISCORD_WEBHOOK_URL"
  