name: Reusable - Docker Multiarch Build

on:
      workflow_call:
        inputs:
          image_name:
            description: "Nom de l'image dans ghcr.io"
            required: true
            type: string
          context:
            description: "Contexte de build Docker"
            required: true
            type: string
          dockerfile:
            description: "Chemin vers le Dockerfile"
            required: true
            type: string
          push_image:
            description: "Pousser l'image et le manifest multi-arch vers ghcr.io"
            required: false
            type: boolean
            default: false
jobs:
      build-multiarch:
        name: Docker Multi-arch (${{ inputs.image_name }})
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write

        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up QEMU
            uses: docker/setup-qemu-action@v3
            with:
              platforms: arm64

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Log in to GitHub Container Registry
            if: inputs.push_image
            uses: docker/login-action@v3
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Extract Docker metadata (tags & labels)
            id: meta
            uses: docker/metadata-action@v5
            with:
              images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
              tags: |
                type=ref,event=branch
                type=sha,prefix=sha-
                type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

          - name: Build and push multi-arch image
            uses: docker/build-push-action@v6
            with:
              context: ${{ inputs.context }}
              file: ${{ inputs.dockerfile }}
              platforms: linux/amd64,linux/arm64
              push: ${{ inputs.push_image }}
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels }}
              cache-from: type=gha,scope=${{ inputs.image_name }}
              cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}