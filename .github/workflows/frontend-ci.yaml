name: Frontend CI React

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - dev
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Security - Gitleaks Scan
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  frontend:
    name: Frontend - Lint, Build & Tests
    needs: [gitleaks]
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run typescript type checking
        run: npm run typecheck

      - name: Run unit tests with coverage (>= 40%)
        run: npm run test:cov
      
      - name: Build application 
        run: npm run build
  notify-failure:
        name: Notify Discord on failure
        needs: [gitleaks, frontend]
        if: failure()
        runs-on: ubuntu-latest
        steps:
          - name: Send Discord notification
            env:
              DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
              WORKFLOW: ${{ github.workflow }}
              REPO: ${{ github.repository }}
              BRANCH: ${{ github.head_ref || github.ref_name }}
              ACTOR: ${{ github.actor }}
              RUN_URL: ${{ github.server_url }}/${{ github.repository}}/actions/runs/${{ github.run_id }}
            run: |
              jq -n \
                --arg title "Echec CI : $WORKFLOW" \
                --arg repo "$REPO" \
                --arg branch "$BRANCH" \
                --arg actor "$ACTOR" \
                --arg url "[Voir le workflow]($RUN_URL)" \
                '{embeds: [{title: $title, color: 15158332, fields: [
                  {name: "Depot", value: $repo, inline: true},
                  {name: "Branche / PR", value: $branch, inline: true},
                  {name: "Auteur", value: $actor, inline: true},
                  {name: "Logs", value: $url, inline: false}
                ]}]}' | curl -fsS -H "Content-Type: application/json" -X \
                POST -d @- "$DISCORD_WEBHOOK_URL"
  